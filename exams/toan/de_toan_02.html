<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Đề Toán THPT">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
<title>Đề Toán THPT | Thư viện đề thi THPT</title>
<style>
:root{
  --bg:#eef2f8;--card:#fff;--ink:#172033;--muted:#5b6577;--line:#dbe2ee;
  --brand:#4338ca;--brand-soft:#eef0ff;--ok:#15803d;--ok-soft:#e8f7ee;
  --bad:#b91c1c;--bad-soft:#fdeaea;--warn:#b45309;--warn-soft:#fff6e5;
  --shadow:0 10px 30px rgba(23,32,51,.08)
}
*{box-sizing:border-box}
html{margin:0;padding:0;min-height:100%;width:100%;height:auto;overflow-x:hidden;overflow-y:auto;touch-action:pan-y pinch-zoom}body{margin:0;padding:0;min-height:100%;height:auto;width:100%;overflow-x:hidden;overflow-y:visible;touch-action:pan-y pinch-zoom}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:auto}
#app{width:100%;max-width:880px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;line-height:1.25}
p{margin:.4em 0}
.kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);font-weight:800}
.title{font-size:1.55rem;margin:6px 0 8px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.start{padding:28px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.chip{background:var(--brand-soft);color:var(--brand);border:1px solid #d9dcfa;border-radius:99px;padding:4px 12px;font-size:.82rem;font-weight:700}
.panel{background:#f8faff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:18px 0}
.field{display:block;font-size:.86rem;font-weight:700;color:var(--muted)}
.field .input{margin-top:6px}
.input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
.input:focus,.short:focus{outline:2px solid var(--brand);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:11px 20px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:800;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#3730a3}
.btn.primary:disabled{background:#b9bdd6;border-color:#b9bdd6;cursor:not-allowed}
.btn.ghost{background:#f4f6fb}
.btn.block{width:100%;margin-top:18px}
.note{font-size:.86rem;color:var(--muted)}
.warnbox{background:var(--warn-soft);border:1px solid #f6d9a8;color:#7c4a03;border-radius:12px;padding:12px 14px;font-size:.9rem;margin-top:16px}
.quizhead{position:sticky;top:8px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.quizhead h1{font-size:1.02rem}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:1.12rem;background:var(--brand-soft);color:var(--brand);padding:6px 12px;border-radius:10px;white-space:nowrap}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.progress{height:8px;background:#e3e8f3;border-radius:99px;overflow:hidden;margin:14px 2px 5px}
.progress>i{display:block;height:100%;width:100%;background:var(--brand);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.progressmeta{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--muted);margin:0 2px 6px}
.q{padding:18px;margin:14px 0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.qnum{font-weight:900;color:var(--brand)}
.qpts{font-size:.78rem;color:var(--muted);white-space:nowrap}
.q-text p{margin:.35em 0}
.q-text img,.rev img,.opt img{max-width:100%;height:auto;border-radius:8px}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;background:#fff}
.opt:hover{border-color:#b9c3da;background:#fbfcff}
.opt input{margin-top:4px;accent-color:var(--brand);flex:none}
.opt .letter{font-weight:900;color:var(--brand);min-width:1.2em}
.opt .txt{min-width:0}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.tf{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.tf-text{flex:1 1 260px;min-width:0}
.tf-choice{display:flex;gap:8px;flex:none;margin-left:auto}
.tf-choice label{display:block;cursor:pointer;position:relative}
.tf-choice span{display:block;min-width:74px;min-height:44px;line-height:24px;padding:10px 14px;text-align:center;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:.95rem;font-weight:700;transition:background .15s,border-color .15s}
.tf-choice span:hover{border-color:#b9c3da}
.tf-choice input{position:absolute;opacity:0;pointer-events:none}
.tf-choice input:checked + span{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.tf-choice input:focus-visible + span{outline:2px solid var(--brand);outline-offset:2px}
.short{width:100%;max-width:340px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:1.05rem;margin-top:12px;background:#fff}
.short-hint{font-size:.82rem;color:var(--muted);margin-top:6px}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px;backdrop-filter:blur(8px)}
.bottombar .count{font-size:.86rem;color:var(--muted)}
.btn.submit{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px 24px;font:inherit;font-weight:900;cursor:pointer;min-height:48px}
.btn.submit:hover{background:#3730a3}
.result{padding:26px}
.bigscore{font-size:2.7rem;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.bigscore small{font-size:1rem;color:var(--muted);font-weight:700}
.scoreline{display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin:16px 0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:#f4f6fb;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.84rem;font-weight:700}
.stat.ok{background:var(--ok-soft);color:var(--ok);border-color:#bbebc9}
.stat.bad{background:var(--bad-soft);color:var(--bad);border-color:#f3c6c6}
.stat.warn{background:var(--warn-soft);color:var(--warn);border-color:#f0d6a4}
.rev-slot{padding-top:2px}
.rev-title{font-size:1.02rem;margin-bottom:4px}
.rev-filter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.rev-grid{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.cell{min-width:36px;height:32px;padding:0 7px;border-radius:8px;border:1px solid var(--line);background:#eef1f7;color:var(--muted);font:inherit;font-size:.82rem;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.cell.ok{background:var(--ok-soft);border-color:#bbebc9;color:var(--ok)}
.cell.part{background:var(--warn-soft);border-color:#f0d6a4;color:var(--warn)}
.cell.bad{background:var(--bad-soft);border-color:#f3c6c6;color:var(--bad)}
.cell:hover{filter:brightness(.95)}
.rev-item.hit{background:var(--brand-soft);border-radius:10px;padding-left:10px;padding-right:10px}
.fb{margin-top:12px;border-radius:12px;padding:10px 12px;font-size:.9rem;font-weight:700}
.fb:empty{display:none}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.part{background:var(--warn-soft);color:var(--warn)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.rev-tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:5px 11px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.rev-tab span{color:var(--muted);font-weight:800}
.rev-tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rev-tab.on span{color:#dfe2ff}
.rev-item{padding:14px 0;border-top:1px solid var(--line)}
.rev-item:first-of-type{border-top:0;padding-top:10px}
.rev-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.badge{font-size:.75rem;font-weight:900;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.part{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.mute{background:#eef1f7;color:var(--muted)}
.rev-opt{display:flex;gap:8px;padding:6px 9px;border-radius:8px;margin-top:4px;align-items:flex-start;flex-wrap:wrap}
.rev-opt.is-correct{background:var(--ok-soft)}
.rev-opt.is-wrong{background:var(--bad-soft)}
.tag{font-size:.72rem;font-weight:800;padding:1px 7px;border-radius:99px;background:#fff;border:1px solid currentColor}
.tag.ok{color:var(--ok)}
.tag.bad{color:var(--bad)}
.tag.pick{color:var(--brand)}
.answerline{font-size:.9rem;margin-top:8px;color:var(--muted)}
.answerline b{color:var(--ink)}
.result-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.ask{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(15,23,42,.45)}
.ask[hidden]{display:none}
.ask-box{width:100%;max-width:430px;background:var(--card);border-radius:16px;padding:20px;box-shadow:0 18px 50px rgba(15,23,42,.3)}
.ask-box p{margin:0;font-weight:700;line-height:1.45}
.ask-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
@media (max-width:420px){.ask-actions .btn{flex:1}}
.hist{margin-top:16px;padding:18px}
.hist-title{font-size:1.02rem;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hist-count{font-size:.8rem;color:var(--muted);font-weight:700}
.run{border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px}
.run>summary{cursor:pointer;padding:9px 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:.9rem}
.run>summary::-webkit-details-marker{display:none}
.run>summary::before{content:'▸';color:var(--brand);font-weight:900}
.run[open]>summary::before{content:'▾'}
.run-no{font-weight:800}
.run-score{font-weight:800;font-variant-numeric:tabular-nums}
.run-at{margin-left:auto;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.run-body{padding:0 12px 12px 30px}
.run-meta{font-size:.84rem;color:var(--muted);margin-bottom:4px}
.jumpnav{position:fixed;right:14px;bottom:84px;z-index:15;display:flex;flex-direction:column;gap:8px}
.jumpnav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.96);box-shadow:var(--shadow);color:var(--brand);font-size:1rem;font-weight:900;cursor:pointer;line-height:1}
.jumpnav button:hover{background:var(--brand-soft)}
body.locked{-webkit-user-select:none;user-select:none}
body.locked .input,body.locked .short{-webkit-user-select:text;user-select:text}
@media (max-width:560px){
  #app{padding:12px 10px calc(92px + env(safe-area-inset-bottom))}
  .start,.result{padding:20px}
  .q{padding:14px}
  .title{font-size:1.3rem}
  .quizhead{padding:12px 14px;top:6px}
  .bottombar{padding:9px 10px}
  .bottombar .count{max-width:45%}
  .btn.submit{padding:11px 18px}
  .jumpnav{right:10px;bottom:76px}
  .jumpnav button{width:40px;height:40px}
}
@media print{
  body{background:#fff}
  #app{max-width:none;padding:0}
  .bottombar,.result-actions,.jumpnav,.ask{display:none}
  .quizhead{position:static;box-shadow:none}
}
#offline-status{margin:8px auto 0;padding:6px 12px;max-width:880px;width:calc(100% - 24px);border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-size:.78rem;line-height:1.35}
#offline-status[data-state="ready"]{background:var(--ok-soft);border-color:#b8e5c6;color:#166534}
#offline-status[data-state="limited"]{background:var(--warn-soft);border-color:#f6d9a8;color:#7c4a03}
@media (max-width:560px){#offline-status{margin-top:6px;font-size:.74rem}}
.backlink{display:inline-flex;align-items:center;gap:6px;margin:10px auto 0;padding:0 12px;max-width:880px;width:calc(100% - 24px);color:var(--brand,#4338ca);text-decoration:none;font-size:.9rem;font-weight:600}
.backlink:hover{text-decoration:underline}
</style>
</head>

ây?","options":["[30;40).","[40;50).","[60;70).","[50;60)."],"correct":0,"correctList":[],"correctTF":[],"correctAnswer":"","tfScoring":"partial","points":0.25},{"type":"truefalse","question":"Nhằm đưa ra cảnh báo sớm về tình trạng sức khỏe của cư dân, người ta sử dụng một ứng dụng trí tuệ nhân tạo để sàng lọc nguy cơ mắc bệnh dựa trên hồ sơ y tế được lưu trữ. Khi phát hiện nguy cơ mắc bệnh, ứng dụng này sẽ gửi cảnh báo để giúp người dân đi khám bệnh kịp thời. Người ta dùng ứng dụng này để tầm soát nguy cơ mắc một loại bệnh. Kết quả thu được khi quét thử nghiệm hồ sơ y tế của 10000 người như sau: Có 1000 người nhận được cảnh báo và 9000 người còn lại không nhận được cảnh báo từ ứng dụng. Trong số 1000 người nhận được cảnh báo thì có 700 người có bệnh và 300 người không có bệnh. Trong số 9000 người không nhận được cảnh báo thì có 100 người có bệnh và 8900 người không có bệnh. Chọn ngẫu nhiên một người trong số 10000 người nói trên.","options":["Xác suất để người đó không nhận được cảnh báo từ ứng dụng bằng 0,9.","Xác suất để người đó không có bệnh, biết rằng người đó không nhận được cảnh báo từ ứng dụng, lớn hơn 0,98.","Xác suất để người đó không có bệnh bằng 0,9.","Xác suất để người đó không nhận được cảnh báo từ ứng dụng, biết rằng người đó không có bệnh, nhỏ hơn 0,95."],"correct":0,"correctList":[],"correctTF":[true,true,false,false],"correctAnswer":"","tfScoring":"partial","points":1},{"type":"truefalse","question":"Cho hàm số  \u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e(\u003c/mo\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmo stretchy=\"false\"\u003e)\u003c/mo\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmn\u003e3\u003c/mn\u003e\u003c/mfrac\u003e\u003cmsup\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmn\u003e3\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e5\u003c/mn\u003e\u003cmsup\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e9\u003c/mn\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e8.\u003c/mn\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003ef(x)=\\frac{1}{3}x³−5x²+9x+8.\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e","options":["Hàm số đã cho có đạo hàm là f′(x) = x² − 10x + 9.","Phương trình f′(x) = 0 có tập nghiệm là S = {1; 9}.","Hàm số đã cho nghịch biến trên khoảng (1; 9).","Giá trị cực tiểu của hàm số đã cho bằng  \u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmfrac\u003e\u003cmn\u003e37\u003c/mn\u003e\u003cmn\u003e3\u003c/mn\u003e\u003c/mfrac\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\frac{37}{3}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e ."],"correct":0,"correctList":[],"correctTF":[true,true,true,false],"correctAnswer":"","tfScoring":"partial","points":1},{"type":"truefalse","question":"Một hệ thống pin năng lượng mặt trời gồm các tấm pin được kết nối với một bộ lưu trữ điện. Trong thời gian mặt trời chiếu sáng của một ngày, năng lượng điện thu được từ các tấm pin được lưu trong bộ lưu trữ điện. Gọi F(t) là năng lượng điện (kWh) lưu trữ được kể từ thời điểm hệ thống bắt đầu hoạt động đến thời điểm t, trong đó t là thời gian tính theo giờ (0 ≤ t ≤ 12) và thời điểm hệ thống bắt đầu hoạt động ứng với t = 0. Biết rằng F(0) = 0. Tốc độ lưu trữ năng lượng điện (kW) của hệ thống này là hàm số f(t) = F′(t) với 0 ≤ t ≤ 12. Số liệu ghi nhận được ở một ngày cụ thể trong năm cho thấy f(t) = −0,3t² + 3,6t với 0 ≤ t ≤ 12.","options":["F = −0,1t³ + 1,8t² với 0 ≤ t ≤ 12.","Năng lượng điện (kWh) lưu trữ được kể từ thời điểm t = a đến thời điểm t = b (0 ≤ a \u0026lt; b ≤ 12) là  \u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmsubsup\u003e\u003cmo\u003e∫\u003c/mo\u003e\u003cmi\u003ea\u003c/mi\u003e\u003cmi\u003eb\u003c/mi\u003e\u003c/msubsup\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmi\u003ed\u003c/mi\u003e\u003cmi\u003et\u003c/mi\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\int_{a}^{b} fdt\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e .","Năng lượng điện lưu trữ được kể từ thời điểm t = 1 đến thời điểm t = 4 nhỏ hơn 20,6 kWh.","Năng lượng điện lưu trữ được kể từ thời điểm t = 1 đến thời điểm t = 7 gấp hai lần năng lượng điện lưu trữ được kể từ thời điểm t = 1 đến thời điểm t = 4."],"correct":0,"correctList":[],"correctTF":[true,true,false,false],"correctAnswer":"","tfScoring":"partial","points":1},{"type":"truefalse","question":"Trong không gian xét hệ tọa độ Oxyz có một đơn vị dài trên các trục tương ứng với 10 mét trên thực tế. Một mục tiêu cần được bảo vệ có vị trí ở gốc tọa độ O. Người ta thiết lập một vành đai bảo vệ quanh mục tiêu theo một đường tròn tâm O có bán kính bằng 7 đơn vị (tương ứng 70 mét trên thực tế) nằm trong mặt phẳng (Oxy). Một máy bay không người lái (được coi như một hạt) bay theo một đường thẳng từ vị trí M(5;10;4) đến vị trí N(14;−2;4). Tại mỗi vị trí của máy bay, khoảng cách từ máy bay đến vành đai bảo vệ là độ dài ngắn nhất của các đoạn thẳng nối từ vị trí đó đến một điểm bất kì trên vành đai.","options":["\u003cspan class=\"katex\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmover accent=\"true\"\u003e\u003cmrow\u003e\u003cmi\u003eM\u003c/mi\u003e\u003cmi\u003eN\u003c/mi\u003e\u003c/mrow\u003e\u003cmo stretchy=\"true\"\u003e→\u003c/mo\u003e\u003c/mover\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\overrightarrow{MN}\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/         } catch (e) {}
        return { runs: [] };
    }

    function writeState() {
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }

    function esc(v) {
        return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function pointsOf(q) {
        var n = Number(q.points);
        if (!isFinite(n) || n <= 0) return 1;
        return Math.min(n, 100);
    }

    function round2(n) { return Math.round(n * 100) / 100; }
    function fmtNum(n) { return String(round2(n)).replace('.', ','); }
    function letter(i) { return String.fromCharCode(65 + i); }

    // Thu tu hien thi cac phuong an cua 1 cau trong 1 luot (luu theo cau goc de
    // cham diem khong doi). Luot cu / cau dung-sai -> giu nguyen thu tu goc.
    function optionOrderOf(qi, source) {
        var n = ((QS[qi] || {}).options || []).length;
        var saved = source && source.optOrder ? source.optOrder[qi] : null;
        if (Array.isArray(saved) && saved.length === n) return saved;
        var order = [];
        for (var i = 0; i < n; i++) order.push(i);
        return order;
    }

    // Chu cai theo vi tri hien thi cua luot, sap xep A..D cho de doc.
    function displayLetters(list, order) {
        return (list || []).map(function (oi) {
            return order.indexOf(oi);
        }).filter(function (at) {
            return at >= 0;
        }).sort(function (a, b) {
            return a - b;
        }).map(letter).join(', ');
    }

    // Tron lua chon rieng cho tung cau (chi cau co A/B/C/D; cau dung-sai giu a) b) c) d)).
    function newOptionOrder() {
        var map = {};
        QS.forEach(function (q, qi) {
            if ((q.type === 'single' || q.type === 'multi') && (q.options || []).length > 1) {
                map[qi] = buildOrder(q.options.length, CFG.shuffle);
            }
        });
        return map;
    }

    // So sanh dap an tra loi ngan giong lib/short-answer.js (so nguyen/thap phan).
    function normNum(v) {
        if (typeof v !== 'string' && typeof v !== 'number') return null;
        var s = String(v).trim();
        if (!s || s.length > 50) return null;
        s = s.replace(',', '.');
        var m = /^([+-]?)(\d*)(?:\.(\d*))?$/.exec(s);
        if (!m) return null;
        var intPart = m[2] || '';
        var frac = m[3] || '';
        if (!intPart && !frac) return null;
        intPart = intPart.replace(/^0+/, '') || '0';
        frac = frac.replace(/0+$/, '');
        var neg = m[1] === '-' && !(intPart === '0' && frac === '');
        return (neg ? '-' : '') + intPart + (frac ? '.' + frac : '');
    }

    function numEquals(a, b) {
        var x = normNum(a), y = normNum(b);
        return !!x && x === y;
    }

    function scoreQuestion(q, ans) {
        if (q.type === 'single') return ans === q.correct ? 1 : 0;
        if (q.type === 'multi') {
            var given = Array.isArray(ans) ? ans.slice().sort(function (a, b) { return a - b; }) : [];
            var right = Array.isArray(q.correctList) ? q.correctList.slice().sort(function (a, b) { return a - b; }) : [];
            if (given.length !== right.length || !given.length) return 0;
            for (var i = 0; i < given.length; i++) if (given[i] !== right[i]) return 0;
            return 1;
        }
        if (q.type === 'truefalse') {
            var correct = 0;
            var total = (q.correctTF || []).length;
            if (!total) return 0;
            for (var j = 0; j < total; j++) {
                if (Array.isArray(ans) && ans[j] === q.correctTF[j]) correct++;
            }
            if (q.tfScoring === 'equal') return correct / total;
            if (total === 4) return [0, 0.1, 0.25, 0.5, 1][correct];
            return correct / total;
        }
        if (q.type === 'shortanswer') return numEquals(ans, q.correctAnswer) ? 1 : 0;
        return 0;
    }

    function hasAnyAnswer(q, a) {
        if (q.type === 'single') return typeof a === 'number' && a >= 0;
        if (q.type === 'multi') return Array.isArray(a) && a.length > 0;
        if (q.type === 'truefalse') return Array.isArray(a) && a.some(function (v) { return v === true || v === false; });
        return String(a == null ? '' : a).trim() !== '';
    }

    function isComplete(q, a) {
        if (q.type === 'single') return typeof a === 'number' && a >= 0;
        if (q.type === 'multi') return Array.isArray(a) && a.length > 0;
        if (q.type === 'truefalse') {
            return Array.isArray(a) && a.length === (q.options || []).length &&
                a.every(function (v) { return v === true || v === false; });
        }
        return String(a == null ? '' : a).trim() !== '';
    }

    function computeResult(answers) {
        var score = 0, max = 0, correct = 0, partial = 0, wrong = 0, unanswered = 0;
        QS.forEach(function (q, i) {
            var pts = pointsOf(q);
            var ratio = scoreQuestion(q, answers[i]);
            max += pts;
            score += ratio * pts;
            if (ratio === 1) correct++;
            else if (!hasAnyAnswer(q, answers[i])) unanswered++;
            else if (ratio > 0) partial++;
            else wrong++;
        });
        return {
            score: round2(score), maxScore: round2(max),
            correct: correct, partial: partial, wrong: wrong, unanswered: unanswered
        };
    }

    function canStart() {
        return MAX_ATTEMPTS === 0 || state.runs.length < MAX_ATTEMPTS;
    }

    function clearedTimer() {
        if (timerId) { clearInterval(timerId); timerId = null; }
    }

    function fmtTime(ms) {
        var s = Math.max(0, Math.ceil(ms / 1000));
        var h = Math.floor(s / 3600);
        var m = Math.floor((s % 3600) / 60);
        var sec = s % 60;
        function two(n) { return (n < 10 ? '0' : '') + n; }
        return (h ? h + ':' : '') + two(m) + ':' + two(sec);
    }

    function fmtDate(ts) {
        var d = new Date(ts);
        if (isNaN(d.getTime())) return '';
        function two(n) { return (n < 10 ? '0' : '') + n; }
        return two(d.getHours()) + ':' + two(d.getMinutes()) + ' ' +
            two(d.getDate()) + '/' + two(d.getMonth() + 1) + '/' + d.getFullYear();
    }

    // Hai nut nhay nhanh, dat co dinh o goc phai gan cuoi man hinh.
    function jumpNav() {
        return '<div class="jumpnav">' +
            '<button type="button" data-scroll="top" aria-label="Lên đầu trang" title="Lên đầu trang">▲</button>' +
            '<button type="button" data-scroll="bottom" aria-label="Xuống cuối trang" title="Xuống cuối trang">▼</button>' +
        '</div>';
    }

    // Moi luot la mot <details> thu gon; bai lam chi duoc ve khi mo dung luot do.
    function renderHistory(openLatest) {
        if (!state.runs.length) return '';
        var rows = state.runs.map(function (run, idx) {
            var key = 'run' + idx;
            var hasAnswers = CFG.showAnswers && run.answers && typeof run.answers === 'object';
            var meta = [];
            if (run.name) meta.push(esc(run.name));
            if (run.timedOut) meta.push('Hết giờ');
            if (typeof run.correct === 'number') meta.push('Đúng ' + run.correct + ' · Sai ' + run.wrong);
            var body = '<div class="run-body">' +
                (meta.length ? '<div class="run-meta">' + meta.join(' · ') + '</div>' : '') +
                (hasAnswers
                    ? reviewSlot(key, run.answers, orderOf(run), run.optOrder)
                    : '<p class="note">' + (CFG.showAnswers ? 'Lượt này chỉ lưu điểm, không có chi tiết bài làm.' : 'Đáp án và chi tiết bài làm do giáo viên giữ.') + '</p>') +
                '</div>';
            return '<details class="run"' + (hasAnswers ? ' data-rev-key="' + key + '"' : '') +
                (openLatest && idx === state.runs.length - 1 ? ' open' : '') + '>' +
                '<summary>' +
                    '<span class="run-no">Lần ' + (idx + 1) + '</span>' +
                    '<span class="run-score">' + fmtNum(run.score) + '/' + fmtNum(run.maxScore) + ' điểm</span>' +
                    '<span class="run-at">' + fmtDate(run.at) + '</span>' +
                '</summary>' + body + '</details>';
        }).reverse().join('');

        return '<div class="card hist"><h2 class="hist-title">Lịch sử làm bài' +
            '<span class="hist-count">' + state.runs.length + ' lượt</span></h2>' +
            '<p class="note" style="margin-top:4px">Bấm vào một lượt để xem chi tiết bài làm.</p>' +
            rows + '</div>';
    }

    // ===== Xem lai bai lam (dung chung cho lich su va ket qua) =====
    // reviewState: key -> { answers, order, filter }
    var reviewState = {};

    var FILTERS = [
        ['all', 'Tất cả'], ['ok', 'Đúng'], ['part', 'Đúng một phần'],
        ['bad', 'Sai'], ['mute', 'Chưa trả lời']
    ];

    function orderOf(run) {
        if (run && Array.isArray(run.order) && run.order.length === QS.length) return run.order;
        var order = [];
        for (var i = 0; i < QS.length; i++) order.push(i);
        return order;
    }

    function reviewSlot(key, answers, order, optOrder) {
        reviewState[key] = {
            answers: answers || {},
            order: order,
            optOrder: optOrder || null,
            filter: reviewState[key] ? reviewState[key].filter : 'all'
        };
        return '<div class="rev-slot" data-rev="' + key + '"></div>';
    }

    function reviewItem(q, qi, pos, a, info, source) {
        return '<div class="rev-item" data-pos="' + pos + '">' +
            '<div class="rev-top"><span class="qnum">Câu ' + (pos + 1) + '</span>' +
                '<span class="badge ' + info.cls + '">' + info.text + '</span></div>' +
            '<div class="q-text">' + q.question + '</div>' +
            reviewOptions(q, a, qi, source) +
        '</div>';
    }

    function fillReview(key) {
        var st = reviewState[key];
        var slot = st ? document.querySelector('[data-rev="' + key + '"]') : null;
        if (!slot) return;

        var counts = { all: 0, ok: 0, part: 0, bad: 0, mute: 0 };
        var cells = [];
        var rows = [];
        st.order.forEach(function (qi, pos) {
            var q = QS[qi];
            if (!q) return;
            var a = st.answers[qi];
            var info = statusInfo(q, a);
            counts.all++;
            counts[info.cls]++;
            cells.push('<button type="button" class="cell ' + info.cls + '" data-jump="' + key + '|' + pos + '"' +
                ' title="Câu ' + (pos + 1) + ': ' + info.text + '"' +
                ' aria-label="Câu ' + (pos + 1) + ': ' + info.text + '">' + (pos + 1) + '</button>');
            if (st.filter === 'all' || st.filter === info.cls) rows.push(reviewItem(q, qi, pos, a, info, st));
        });

        var tabs = FILTERS.map(function (f) {
            return '<button type="button" class="rev-tab' + (st.filter === f[0] ? ' on' : '') + '"' +
                ' data-rev-key="' + key + '" data-rev-filter="' + f[0] + '">' +
                f[1] + ' <span>' + counts[f[0]] + '</span></button>';
        }).join('');

        slot.innerHTML =
            '<h2 class="rev-title">Xem lại bài làm</h2>' +
            '<div class="rev-grid">' + cells.join('') + '</div>' +
            '<div class="note">Xanh: đúng · Vàng: đúng một phần · Đỏ: sai · Xám: chưa trả lời. Bấm số câu để xem chi tiết.</div>' +
            '<div class="rev-filter" role="group" aria-label="Lọc câu theo kết quả">' + tabs + '</div>' +
            (rows.length ? rows.join('') : '<p class="note">Không có câu nào trong nhóm này.</p>');
    }

    // Bam so cau trong bang dap an -> nhay toi dung cau do trong bai lam.
    function jumpTo(spec) {
        var cut = spec.lastIndexOf('|');
        var key = spec.slice(0, cut);
        var pos = spec.slice(cut + 1);
        var st = reviewState[key];
        if (!st) return;
        st.filter = 'all';
        fillReview(key);
        var el = document.querySelector('[data-rev="' + key + '"] .rev-item[data-pos="' + pos + '"]');
        if (!el) return;
        el.scrollIntoView({ block: 'center' });
        el.classList.add('hit');
        setTimeout(function () { el.classList.remove('hit'); }, 2000);
    }

    // Mo luot nao moi ve bai lam cua luot do (khong dung san HTML cho tat ca).
    function wireReviews() {
        var list = document.querySelectorAll('details.run[data-rev-key]');
        for (var i = 0; i < list.length; i++) {
            (function (d) {
                var key = d.getAttribute('data-rev-key');
                if (d.open) fillReview(key);
                d.ontoggle = function () { if (d.open) fillReview(key); };
            })(list[i]);
        }
    }


    function renderStart() {
        clearedTimer();
        var used = state.runs.length;
        var blocked = !canStart();
        var modeText = CFG.mode === 'practice' ? 'Ôn tập' : 'Thi';
        var rules = [];
        if (CFG.mode === 'practice') {
            rules.push(MAX_ATTEMPTS > 0 ? 'Tối đa ' + MAX_ATTEMPTS + ' lượt làm bài.' : 'Được làm lại không giới hạn số lần.');
        } else {
            rules.push('Chỉ làm một lần. Nộp bài xong không làm lại.');
        }
        if (CFG.mode === 'exam' && CFG.minutes > 0) {
            rules.push('Thời gian làm bài ' + CFG.minutes + ' phút; hết giờ hệ thống tự nộp.');
        }
        if (CFG.shuffle) rules.push('Thứ tự câu hỏi được xáo trộn ở mỗi lượt làm.');
        if (CFG.instant) rules.push('Chọn đáp án xong sẽ biết ngay câu đó đúng hay sai.');
        if (CFG.lockdown) rules.push('Chống gian lận: tự bật toàn màn hình, không copy được nội dung, chặn phím tắt.');
        rules.push(CFG.showAnswers ? 'Sau khi nộp, xem được đáp án đúng và bài làm của mình.' : 'Sau khi nộp, chỉ xem điểm; đáp án do giáo viên giữ.');

        app.innerHTML =
            '<div class="card start">' +
                '<div class="kicker">Bài kiểm tra ' + (CFG.mode === 'practice' ? 'ôn tập' : 'trực tuyến (offline)') + '</div>' +
                '<h1 class="title">' + esc(DATA.title) + '</h1>' +
                '<div class="meta">' +
                    '<span class="chip">' + QS.length + ' câu</span>' +
                    '<span class="chip">' + fmtNum(QS.reduce(function (s, q) { return s + pointsOf(q); }, 0)) + ' điểm</span>' +
                    '<span class="chip">' + modeText + '</span>' +
                    (CFG.mode === 'exam' && CFG.minutes > 0 ? '<span class="chip">' + CFG.minutes + ' phút</span>' : '') +
                    (CFG.mode === 'practice' && MAX_ATTEMPTS > 0 ? '<span class="chip">' + used + '/' + MAX_ATTEMPTS + ' lượt đã làm</span>' : '') +
                '</div>' +
                '<div class="panel">' +
                    '<label class="field">Họ và tên' +
                        '<input id="studentName" class="input" maxlength="80" autocomplete="off" placeholder="Nhập họ tên để hiện trên kết quả" value="' + esc(state.name || '') + '" required>' +
                    '</label>' +
                    '<label class="field">Lớp' +
                        '<input id="studentClass" class="input" maxlength="20" autocomplete="off" placeholder="Ví dụ: 12A1" value="' + esc(state.studentClass || '') + '" required>' +
                    '</label>' +
                    '</div>' +
                    '<div id="studentError" class="warnbox" role="alert" hidden></div>' +
                '<div class="note"><b>Thể lệ</b><br>' + rules.map(function (r) { return '• ' + r; }).join('<br>') + '</div>' +
                (blocked ? '<div class="warnbox">Bạn đã dùng hết ' + MAX_ATTEMPTS + ' lượt làm bài của đề này.</div>' : '') +
                '<button id="startBtn" class="btn primary block" ' + (blocked ? 'disabled' : '') + '>' +
                    (blocked ? 'Đã hết lượt' : 'Bắt đầu làm bài') +
                '</button>' +
            '</div>' +
            renderHistory(false) +
            jumpNav();
        wireReviews();

        var btn = document.getElementById('startBtn');
        if (btn && !blocked) btn.onclick = function () {
            var nameEl = document.getElementById('studentName');
            var classEl = document.getElementById('studentClass');
            var name = nameEl ? nameEl.value.trim() : '';
            var className = classEl ? classEl.value.trim() : '';
            var errorEl = document.getElementById('studentError');
            if (!name || !className) {
                if (errorEl) {
                    errorEl.textContent = (!name && !className)
                        ? 'Vui lòng nhập họ tên và lớp trước khi bắt đầu.'
                        : (!name ? 'Vui lòng nhập họ tên trước khi bắt đầu.' : 'Vui lòng nhập lớp trước khi bắt đầu.');
                    errorEl.hidden = false;
                }
                if (!name && nameEl) nameEl.focus();
                else if (classEl) classEl.focus();
                return;
            }
            if (errorEl) { errorEl.hidden = true; errorEl.textContent = ''; }
            state.name = name;
            state.studentClass = className;
            state.last = null;
            state.current = {
                startedAt: Date.now(),
                name: name,
                studentClass: className,
                answers: {},
                order: buildOrder(QS.length, CFG.shuffle),
                optOrder: newOptionOrder(),
                deadline: (CFG.mode === 'exam' && CFG.minutes > 0) ? Date.now() + CFG.minutes * 60000 : null
            };
            writeState();
            showQuiz();
        };
        window.scrollTo(0, 0);
    }

    // qi = chi so goc cua cau (khoa dap an), pos = vi tri hien thi trong luot lam.
    function renderQuestion(q, qi, pos) {
        var a = state.current && state.current.answers ? state.current.answers[qi] : undefined;
        var body = '';

        if (q.type === 'single') {
            body = '<div class="opts">' + optionOrderOf(qi, state.current).map(function (oi, at) {
                return '<label class="opt"><input type="radio" data-role="single" data-qi="' + qi + '" data-oi="' + oi + '" name="s_' + qi + '" value="' + oi + '" ' + (a === oi ? 'checked' : '') + '>' +
                    '<span class="letter">' + letter(at) + '.</span><span class="txt">' + q.options[oi] + '</span></label>';
            }).join('') + '</div>';
        } else if (q.type === 'multi') {
            var picked = Array.isArray(a) ? a : [];
            body = '<div class="opts">' + optionOrderOf(qi, state.current).map(function (oi, at) {
                return '<label class="opt"><input type="checkbox" data-role="multi" data-qi="' + qi + '" data-oi="' + oi + '" ' + (picked.indexOf(oi) >= 0 ? 'checked' : '') + '>' +
                    '<span class="letter">' + letter(at) + '.</span><span class="txt">' + q.options[oi] + '</span></label>';
            }).join('') + '</div>';
        } else if (q.type === 'truefalse') {
            var tf = Array.isArray(a) ? a : [];
            body = q.options.map(function (o, oi) {
                var v = tf[oi];
                var name = 'tf_' + qi + '_' + oi;
                var y = 'abcd'.charAt(oi);
                return '<div class="tf"><div class="tf-text"><b>' + y + ')</b> ' + o + '</div>' +
                    '<div class="tf-choice" role="group" aria-label="Ý ' + y + '">' +
                        '<label><input type="radio" data-role="tf" data-qi="' + qi + '" data-oi="' + oi + '" name="' + name + '" value="true" aria-label="Ý ' + y + ': Đúng" ' + (v === true ? 'checked' : '') + '><span>Đúng</span></label>' +
                        '<label><input type="radio" data-role="tf" data-qi="' + qi + '" data-oi="' + oi + '" name="' + name + '" value="false" aria-label="Ý ' + y + ': Sai" ' + (v === false ? 'checked' : '') + '><span>Sai</span></label>' +
                    '</div></div>';
            }).join('');
        } else {
            body = '<input type="text" class="short" inputmode="decimal" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false" ' +
                'data-role="short" data-qi="' + qi + '" aria-label="Trả lời ngắn cho câu ' + (pos + 1) + '" ' +
                'value="' + esc(a || '') + '" placeholder="Nhập đáp án (số nguyên hoặc số thập phân)">' +
                '<div class="short-hint">Chỉ nhập số, dùng dấu phẩy hoặc dấu chấm cho phần thập phân.</div>';
        }

        return '<section class="card q" id="q' + qi + '">' +
            '<div class="qhead"><span class="qnum">Câu ' + (pos + 1) + '</span>' +
                '<span class="qpts">' + fmtNum(pointsOf(q)) + ' điểm</span></div>' +
            '<div class="q-text">' + q.question + '</div>' + body +
            (CFG.instant ? '<div class="fb" id="fb' + qi + '"></div>' : '') +
        '</section>';
    }

    function showQuiz() {
        if (!state.current) { renderStart(); return; }
        clearedTimer();
        var order = orderOf(state.current);
        var nameLine = state.current.name ? ' · ' + esc(state.current.name) : '';
        var timer = (CFG.mode === 'exam' && CFG.minutes > 0) ? '<div class="timer" id="timer">--:--</div>' : '';
        app.innerHTML =
            '<div class="quizhead"><div><div class="kicker">' + (CFG.mode === 'practice' ? 'Ôn tập' : 'Thi') + nameLine + '</div>' +
                '<h1>' + esc(DATA.title) + '</h1></div>' + timer + '</div>' +
            '<div class="progress"><i id="progBar"></i></div>' +
            '<div class="progressmeta"><span id="progText">Đã trả lời 0/' + QS.length + ' câu</span><span>' +
                (CFG.mode === 'practice' ? 'Làm lại được' : 'Chỉ một lượt') + '</span></div>' +
            order.map(function (qi, pos) { return renderQuestion(QS[qi], qi, pos); }).join('') +
            '<div class="bottombar"><span class="count" id="botText">0/' + QS.length + ' câu</span>' +
                '<button class="btn submit" id="submitBtn">Nộp bài</button></div>' +
            '<div class="ask" id="ask" hidden>' +
                '<div class="ask-box" role="dialog" aria-modal="true" aria-labelledby="askMsg">' +
                    '<p id="askMsg"></p>' +
                    '<div class="ask-actions">' +
                        '<button type="button" class="btn ghost" id="askCancel">Làm tiếp</button>' +
                        '<button type="button" class="btn submit" id="askOk">Nộp bài</button>' +
                    '</div>' +
                '</div>' +
            '</div>';

        document.getElementById('submitBtn').onclick = function () { submit(false); };
        document.getElementById('askCancel').onclick = function () { document.getElementById('ask').hidden = true; };
        document.getElementById('askOk').onclick = function () {
            document.getElementById('ask').hidden = true;
            doSubmit(false);
        };
        updateProgress();
        if (CFG.instant) order.forEach(function (qi) { updateFeedback(qi); });
        startTimer();
        window.scrollTo(0, 0);
    }

    function updateProgress() {
        if (!state.current) return;
        var done = 0;
        QS.forEach(function (q, i) {
            if (isComplete(q, state.current.answers[i])) done++;
        });
        var bar = document.getElementById('progBar');
        var text = document.getElementById('progText');
        var bot = document.getElementById('botText');
        var pct = QS.length ? Math.round(done / QS.length * 100) : 0;
        if (bar) bar.style.transform = 'scaleX(' + (pct / 100) + ')';
        if (text) text.textContent = 'Đã trả lời ' + done + '/' + QS.length + ' câu';
        if (bot) bot.textContent = done + '/' + QS.length + ' câu';
    }

    function onAnswer(e) {
        if (!state.current) return;
        var t = e.target;
        var role = t.getAttribute && t.getAttribute('data-role');
        if (!role) return;
        var qi = parseInt(t.getAttribute('data-qi'), 10);
        if (!(qi >= 0 && qi < QS.length)) return;
        var oi = parseInt(t.getAttribute('data-oi'), 10);
        var answers = state.current.answers;

        if (role === 'single') {
            answers[qi] = oi;
        } else if (role === 'multi') {
            var list = Array.isArray(answers[qi]) ? answers[qi].slice() : [];
            if (t.checked) { if (list.indexOf(oi) < 0) list.push(oi); }
            else list = list.filter(function (x) { return x !== oi; });
            list.sort(function (a, b) { return a - b; });
            answers[qi] = list;
        } else if (role === 'tf') {
            var tf = Array.isArray(answers[qi]) ? answers[qi].slice() : [];
            var need = (QS[qi].options || []).length;
            while (tf.length < need) tf.push(null);
            tf[oi] = t.value === 'true';
            answers[qi] = tf;
        } else if (role === 'short') {
            answers[qi] = t.value;
        } else {
            return;
        }
        writeState();
        updateProgress();
        updateFeedback(qi);
    }

    function startTimer() {
        clearedTimer();
        if (CFG.mode !== 'exam' || !CFG.minutes || !state.current) return;
        tick();
        timerId = setInterval(tick, 1000);

        function tick() {
            if (!state.current) { clearedTimer(); return; }
            var left = state.current.deadline - Date.now();
            var el = document.getElementById('timer');
            if (left <= 0) { clearedTimer(); submit(true); return; }
            if (el) {
                el.textContent = fmtTime(left);
                el.className = 'timer' + (left < 60000 ? ' low' : '');
            }
        }
    }

    // Hoi lai bang hop thoai TRONG TRANG: window.confirm bi chan o mot so
    // trinh duyet di dong (Safari iOS mo file trong app/iframe) nen bam "Nop bai"
    // khong lam gi ca. (shortcut: khong dung confirm/prompt o bat ky dau.)
    function submit(auto) {
        if (!state.current) return;
        if (auto) { doSubmit(true); return; }
        var order = orderOf(state.current);
        var missing = [];
        order.forEach(function (qi, pos) {
            if (!isComplete(QS[qi], state.current.answers[qi])) missing.push(pos + 1);
        });
        var msg;
        if (missing.length) {
            var sample = missing.slice(0, 12).join(', ') + (missing.length > 12 ? '…' : '');
            msg = 'Còn ' + missing.length + ' câu chưa trả lời (câu ' + sample + ').<br>Vẫn nộp bài?';
        } else {
            msg = 'Nộp bài? Sau khi nộp sẽ không sửa được nữa.';
        }
        var box = document.getElementById('ask');
        if (!box) { doSubmit(false); return; }
        document.getElementById('askMsg').innerHTML = msg;
        box.hidden = false;
    }

    function doSubmit(auto) {
        if (!state.current) return;
        var order = orderOf(state.current);
        clearedTimer();
        var answers = state.current.answers;
        var res = computeResult(answers);
        var last = {
            answers: answers,
            at: Date.now(),
            name: state.current.name || '',
            timedOut: !!auto,
            score: res.score,
            maxScore: res.maxScore
        };
        state.last = last;
        state.runs.push({
            at: last.at, name: last.name, score: res.score, maxScore: res.maxScore,
            correct: res.correct, partial: res.partial, wrong: res.wrong,
            unanswered: res.unanswered, total: QS.length, timedOut: last.timedOut,
            order: order, optOrder: state.current.optOrder || null, answers: answers
        });
        // shortcut: chi giu bai lam 30 luot gan nhat de localStorage khong phinh.
        if (state.runs.length > 30) {
            delete state.runs[state.runs.length - 31].answers;
            delete state.runs[state.runs.length - 31].optOrder;
        }
        var submitDuration = state.current.startedAt
            ? Math.max(0, Math.round((Date.now() - state.current.startedAt) / 1000))
            : 0;
        if (window.ExamResultQueue && typeof window.ExamResultQueue.enqueue === 'function') {
            try {
                window.ExamResultQueue.enqueue({
                    examId: DATA.id,
                    studentName: last.name || '',
                    studentClass: state.current.studentClass || '',
                    answers: answers,
                    durationSeconds: submitDuration,
                    timedOut: last.timedOut
                });
            } catch (error) {}
        }
        state.current = null;
        writeState();
        renderResult(last);
    }

    function statusInfo(q, a) {
        var ratio = scoreQuestion(q, a);
        if (ratio === 1) return { cls: 'ok', text: 'Đúng' };
        if (!hasAnyAnswer(q, a)) return { cls: 'mute', text: 'Chưa trả lời' };
        if (ratio > 0) return { cls: 'part', text: 'Đúng một phần' };
        return { cls: 'bad', text: 'Sai' };
    }

    // Dap an dung dang chu de hien ngay sau khi chon (chi khi giao vien cho xem dap an).
    // Chu cai phai theo VI TRI HIEN THI cua luot lam, khong phai chi so goc.
    function correctText(q, qi) {
        var order = optionOrderOf(qi, state.current);
        if (q.type === 'single') {
            var at = order.indexOf(q.correct);
            return at >= 0 && q.options[q.correct] ? letter(at) + '. ' + q.options[q.correct] : '';
        }
        if (q.type === 'multi') return displayLetters(q.correctList, order);
        if (q.type === 'truefalse') {
            return (q.correctTF || []).map(function (v, i) {
                return 'abcd'.charAt(i) + ') ' + (v ? 'Đúng' : 'Sai');
            }).join(' · ');
        }
        return esc(q.correctAnswer);
    }

    function updateFeedback(qi) {
        var box = document.getElementById('fb' + qi);
        if (!box || !state.current || !QS[qi]) return;
        var q = QS[qi];
        var a = state.current.answers[qi];
        var info = statusInfo(q, a);
        if (info.cls === 'mute') { box.innerHTML = ''; return; }
        var mark = info.cls === 'ok' ? '✔ ' : (info.cls === 'part' ? '◐ ' : '✘ ');
        box.className = 'fb ' + info.cls;
        box.innerHTML = mark + info.text +
            (CFG.showAnswers ? ' · Đáp án: <b>' + correctText(q, qi) + '</b>' : '');
    }

    function reviewOptions(q, a, qi, source) {
        var order = optionOrderOf(qi, source);
        if (q.type === 'single') {
            return '<div class="opts">' + order.map(function (oi, at) {
                var cls = '';
                if (oi === q.correct) cls += ' is-correct';
                if (a === oi && oi !== q.correct) cls += ' is-wrong';
                return '<div class="rev-opt' + cls + '"><span class="letter">' + letter(at) + '.</span><span class="txt">' + q.options[oi] + '</span>' +
                    (oi === q.correct ? '<span class="tag ok">Đáp án</span>' : '') +
                    (a === oi ? '<span class="tag pick">Bạn chọn</span>' : '') + '</div>';
            }).join('') + '</div>';
        }
        if (q.type === 'multi') {
            var picked = Array.isArray(a) ? a : [];
            var right = q.correctList || [];
            return '<div class="opts">' + order.map(function (oi, at) {
                var isRight = right.indexOf(oi) >= 0;
                var isPicked = picked.indexOf(oi) >= 0;
                var cls = isRight ? ' is-correct' : (isPicked ? ' is-wrong' : '');
                return '<div class="rev-opt' + cls + '"><span class="letter">' + letter(at) + '.</span><span class="txt">' + q.options[oi] + '</span>' +
                    (isRight ? '<span class="tag ok">Đáp án</span>' : '') +
                    (isPicked ? '<span class="tag pick">Bạn chọn</span>' : '') + '</div>';
            }).join('') + '</div>' +
            '<div class="answerline">Đáp án: <b>' + (displayLetters(right, order) || '—') + '</b> · Bạn chọn: <b>' + (displayLetters(picked, order) || '—') + '</b></div>';
        }
        if (q.type === 'truefalse') {
            var tf = Array.isArray(a) ? a : [];
            return '<div class="opts">' + (q.options || []).map(function (o, oi) {
                var rightV = (q.correctTF || [])[oi];
                var pick = tf[oi];
                var isRight = pick === rightV;
                var cls = isRight ? ' is-correct' : (pick === null || pick === undefined ? '' : ' is-wrong');
                var mark = (pick === null || pick === undefined) ? '' : (isRight ? '✔ ' : '✘ ');
                return '<div class="rev-opt' + cls + '"><span class="txt"><b>' + 'abcd'.charAt(oi) + ')</b> ' + o + '</span>' +
                    '<span class="tag ok">Đáp án: ' + (rightV ? 'Đúng' : 'Sai') + '</span>' +
                    '<span class="tag ' + (pick === null || pick === undefined ? '' : (isRight ? 'ok' : 'bad')) + '">' + mark + 'Bạn chọn: ' + (pick === true ? 'Đúng' : pick === false ? 'Sai' : '—') + '</span></div>';
            }).join('') + '</div>';
        }
        var yours = String(a == null ? '' : a).trim();
        return '<div class="answerline">Đáp án: <b>' + esc(q.correctAnswer) + '</b> · Bạn trả lời: <b>' +
            (yours ? esc(yours) : '—') + '</b></div>';
    }

    function renderResult(last) {
        clearedTimer();
        var res = computeResult(last.answers);
        var pct = res.maxScore > 0 ? Math.round(res.score / res.maxScore * 100) : 0;
        var msg;
        if (CFG.mode === 'exam') {
            msg = last.timedOut
                ? 'Hết giờ làm bài. Điểm đã được ghi nhận trên máy này.'
                : 'Đã nộp bài. Điểm đã được ghi nhận trên máy này.';
        } else if (pct === 100) msg = 'Hoàn hảo! Bạn đã làm đúng toàn bộ bài.';
        else if (pct >= 80) msg = 'Rất tốt! Chỉ còn vài chỗ cần xem lại.';
        else if (pct >= 50) msg = 'Khá ổn. Hãy xem lại những câu còn sai để chắc kiến thức.';
        else msg = 'Đừng lo — xem lại đáp án và thử làm lại để tiến bộ.';

        var runText = '';
        if (CFG.mode === 'practice' && MAX_ATTEMPTS > 0) {
            runText = 'Lượt ' + state.runs.length + '/' + MAX_ATTEMPTS;
        }

        var actions = '';
        if (canStart()) {
            actions += '<button class="btn primary" id="retryBtn">Làm lại</button>';
        }
        actions += '<button class="btn ghost" id="homeBtn">Về trang đầu</button>';

        app.innerHTML =
            '<div class="card result">' +
                '<div class="kicker">Kết quả ' + (CFG.mode === 'practice' ? 'ôn tập' : 'bài thi') + (runText ? ' · ' + esc(runText) : '') + '</div>' +
                '<h1 class="title">' + esc(DATA.title) + '</h1>' +
                (last.name ? '<div class="note">Học sinh: <b>' + esc(last.name) + '</b></div>' : '') +
                (last.studentClass ? '<div class="note">Lớp: <b>' + esc(last.studentClass) + '</b></div>' : '') +
                (last.timedOut ? '<div class="warnbox">Hết giờ — bài đã được tự động nộp.</div>' : '') +
                '<div class="scoreline">' +
                    '<div class="bigscore">' + fmtNum(res.score) + ' <small>/ ' + fmtNum(res.maxScore) + ' điểm</small></div>' +
                    '<div class="stats">' +
                        '<span class="stat">' + pct + '%</span>' +
                        '<span class="stat ok">Đúng ' + res.correct + '</span>' +
                        (res.partial ? '<span class="stat warn">Đúng một phần ' + res.partial + '</span>' : '') +
                        '<span class="stat bad">Sai ' + res.wrong + '</span>' +
                        '<span class="stat">Chưa trả lời ' + res.unanswered + '</span>' +
                    '</div>' +
                '</div>' +
                '<div class="note">' + msg + '</div>' +
                '<div class="note" style="margin-top:10px;">Chụp màn hình kết quả này để gửi giáo viên (nếu được yêu cầu).</div>' +
                '<div class="result-actions">' + actions + '</div>' +
            '</div>' +
            renderHistory(true) +
            jumpNav();
        wireReviews();

        var retry = document.getElementById('retryBtn');
        if (retry) retry.onclick = function () {
            if (!canStart()) { renderStart(); return; }
            state.last = null;
            state.current = {
                startedAt: Date.now(),
                name: state.name || last.name || '',
                answers: {},
                order: buildOrder(QS.length, CFG.shuffle),
                optOrder: newOptionOrder(),
                deadline: (CFG.mode === 'exam' && CFG.minutes > 0) ? Date.now() + CFG.minutes * 60000 : null
            };
            writeState();
            showQuiz();
        };
        var home = document.getElementById('homeBtn');
        if (home) home.onclick = renderStart;
        window.scrollTo(0, 0);
    }

    app.addEventListener('change', onAnswer);
    app.addEventListener('input', onAnswer);

    // Bam so cau trong bang dap an -> nhay toi cau do; bam bo loc -> chi ve lai phan xem lai.
    app.addEventListener('click', function (e) {
        var el = e.target;
        var nav = el && el.closest ? el.closest('[data-scroll]') : null;
        if (nav) {
            window.scrollTo(0, nav.getAttribute('data-scroll') === 'top' ? 0 : document.documentElement.scrollHeight);
            return;
        }
        var jump = el && el.closest ? el.closest('[data-jump]') : null;
        if (jump) { jumpTo(jump.getAttribute('data-jump')); return; }
        var btn = el && el.closest ? el.closest('[data-rev-filter]') : null;
        if (!btn) return;
        var key = btn.getAttribute('data-rev-key');
        if (!reviewState[key]) return;
        reviewState[key].filter = btn.getAttribute('data-rev-filter');
        fillReview(key);
    });

    // Chong gian lan: toan man hinh, chan copy va phim tat (tat duoc khi xuat file).
    var BLOCK_KEYS = ['c', 'x', 'a', 's', 'p', 'u', 'f'];
    function enterFullscreen() {
        var el = document.documentElement;
        try {
            if (!document.fullscreenElement && el.requestFullscreen) {
                var p = el.requestFullscreen();
                if (p && p.catch) p.catch(function () {});
            }
        } catch (e) {}
    }
    if (CFG.lockdown) {
        document.body.classList.add('locked');
        ['copy', 'cut', 'contextmenu', 'dragstart'].forEach(function (name) {
            document.addEventListener(name, function (e) { e.preventDefault(); });
        });
        document.addEventListener('keydown', function (e) {
            var k = (e.key || '').toLowerCase();
            if (k === 'f12') { e.preventDefault(); return; }
            if (!(e.ctrlKey || e.metaKey)) return;
            if (BLOCK_KEYS.indexOf(k) >= 0 || (e.shiftKey && ['i', 'j', 'c'].indexOf(k) >= 0)) e.preventDefault();
        });
        // Trinh duyet chi cho vao toan man hinh tu mot cu dong cua nguoi dung.
        document.addEventListener('click', enterFullscreen);
        enterFullscreen();
    }

    // Khoi dong: dang lam -> tiep tuc; da nop -> xem ket qua; chua lam -> trang dau.
    if (state.current) {
        if (state.current.deadline && Date.now() >= state.current.deadline) {
            submit(true);
        } else {
            showQuiz();
        }
    } else if (state.last) {
        renderResult(state.last);
    } else {
        renderStart();
    }
})(function buildOrder(count, shuffle, rng) {
    var order = [];
    for (var i = 0; i < count; i++) order.push(i);
    if (!shuffle) return order;
    rng = rng || Math.random;
    for (var j = order.length - 1; j > 0; j--) {
        var k = Math.floor(rng() * (j + 1));
        var tmp = order[j];
        order[j] = order[k];
        order[k] = tmp;
    }
    return order;
});</script>
<script>
(function () {
  var status = document.getElementById('offline-status');
  function setStatus(message, state) {
    if (!status) return;
    status.textContent = message;
    status.setAttribute('data-state', state || 'limited');
  }
  function onlineMessage() {
    if (!navigator.onLine) {
      setStatus('Bạn đang ngoại tuyến. Nếu trang đã được lưu trước đó, bạn vẫn có thể làm bài; lịch sử được lưu trên thiết bị này.', 'ready');
    }
  }
  window.addEventListener('online', function () {
    setStatus('Đã có kết nối mạng. Bài làm và lịch sử vẫn được lưu trên thiết bị này.', 'ready');
  });
  window.addEventListener('offline', onlineMessage);
  if (!('serviceWorker' in navigator)) {
    setStatus('Trình duyệt này không hỗ trợ lưu bài để dùng ngoại tuyến. Hãy mở bằng Safari hoặc Chrome.', 'limited');
    return;
  }
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    setStatus('Cần mở bài thi bằng đường link HTTPS để bật chế độ ngoại tuyến.', 'limited');
    return;
  }
  navigator.serviceWorker.register('../../sw.js', { scope: '../../' })
    .then(function (registration) {
      if (registration.active || navigator.serviceWorker.controller) {
        setStatus('Chế độ ngoại tuyến đã sẵn sàng. Hãy mở trang này online một lần trước khi ngắt mạng.', 'ready');
      } else {
        setStatus('Đang lưu bản dùng ngoại tuyến. Giữ trang mở thêm vài giây, rồi tải lại một lần.', 'limited');
      }
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        setStatus('Chế độ ngoại tuyến đã sẵn sàng. Bạn có thể mở lại bài thi khi mất mạng.', 'ready');
      });
      if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
    })
    .catch(function () {
      setStatus('Chưa bật được chế độ ngoại tuyến trong trình duyệt này. Hãy mở link bằng Safari hoặc Chrome.', 'limited');
    });
  onlineMessage();
})();
</script>
